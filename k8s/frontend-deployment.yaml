apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental360-frontend
  labels:
    app.kubernetes.io/name: rental360-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rental360-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rental360-frontend
    spec:
      containers:
        - name: rental360-frontend
          image: rental360-frontend:local
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rental360-frontend
spec:
  selector:
    app.kubernetes.io/name: rental360-frontend
  ports:
    - port: 80
      targetPort: http
