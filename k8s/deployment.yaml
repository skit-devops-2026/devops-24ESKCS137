apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental360
  labels:
    app.kubernetes.io/name: rental360
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rental360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rental360
    spec:
      containers:
        - name: rental360
          image: rental360:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: GIT_SHA
              value: "51cb8e6cce65408b60106ddad406f196211617bb"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

